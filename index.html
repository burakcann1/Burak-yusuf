<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>burakveyusuf — Dünya</title>
  <meta name="description" content="burakveyusuf — yörüngeden gerçekçi Dünya. Saati ve dilimi seç, kıtaların ışıkları geceye geçsin." />
  <meta name="theme-color" content="#05060a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231a3a6e'/><circle cx='50' cy='50' r='38' fill='%232e6b4e'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05060a;
      --fg: #e8ecf4;
      --muted: #8b93a7;
      --accent: #7eb8ff;
      --panel: rgba(12, 14, 22, 0.72);
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font-family: "Outfit", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #canvas-wrap {
      position: fixed; inset: 0; z-index: 0;
    }
    canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
    .ui {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none;
      display: flex; flex-direction: column;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 1.25rem 1.5rem;
      pointer-events: none;
    }
    .brand {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.35rem; font-weight: 600; letter-spacing: 0.02em;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
    }
    .brand span { opacity: 0.55; font-weight: 500; }
    .controls {
      display: flex; gap: 0.5rem; pointer-events: auto;
    }
    .btn {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .btn:hover { background: rgba(20, 24, 36, 0.85); border-color: rgba(255,255,255,0.15); }
    .btn:active { transform: scale(0.97); }
    .btn.primary {
      background: linear-gradient(135deg, #3a6ea5, #1e4a7a);
      border-color: rgba(126, 184, 255, 0.35);
    }
    .panel {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem 1.15rem;
      backdrop-filter: blur(16px);
      max-width: 280px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .panel h3 {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin-bottom: 0.65rem; font-weight: 500;
    }
    .time-row {
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;
    }
    .time-display {
      font-variant-numeric: tabular-nums;
      font-size: 1.45rem; font-weight: 600;
      letter-spacing: 0.02em;
    }
    select, input[type="range"] {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
    }
    select { cursor: pointer; margin-bottom: 0.65rem; }
    input[type="range"] {
      -webkit-appearance: none; height: 6px; padding: 0;
      background: rgba(255,255,255,0.12); border: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); cursor: pointer;
      box-shadow: 0 0 8px rgba(126,184,255,0.5);
    }
    .live-toggle {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem;
      cursor: pointer; user-select: none;
    }
    .live-toggle input { accent-color: var(--accent); width: auto; }
    .bottom {
      margin-top: auto;
      padding: 1.25rem 1.5rem 1.75rem;
      display: flex; justify-content: center; align-items: flex-end;
      gap: 1rem; flex-wrap: wrap;
    }
    .hint {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      max-width: 320px;
      line-height: 1.45;
      transition: opacity 0.6s;
    }
    .hint.hidden { opacity: 0; pointer-events: none; }
    .finale {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(5,6,10,0.55);
      backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.8s;
    }
    .finale.show { opacity: 1; pointer-events: auto; }
    .finale-text {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-weight: 600;
      text-align: center;
      line-height: 1.25;
      text-shadow: 0 4px 40px rgba(0,0,0,0.8);
      letter-spacing: 0.01em;
    }
    .finale-text span {
      display: block;
      opacity: 0;
      transform: translateY(12px);
      animation: wordIn 0.7s forwards;
    }
    @keyframes wordIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .loading {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg);
      transition: opacity 0.6s, visibility 0.6s;
    }
    .loading.done { opacity: 0; visibility: hidden; }
    .loading-bar {
      width: 160px; height: 3px; background: rgba(255,255,255,0.1);
      border-radius: 2px; overflow: hidden; margin-top: 1rem;
    }
    .loading-bar > div {
      height: 100%; width: 0%; background: var(--accent);
      transition: width 0.25s;
    }
    .loading p { font-size: 0.85rem; color: var(--muted); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="brand" style="font-size:1.5rem">burakveyusuf</div>
    <div class="loading-bar"><div id="load-prog"></div></div>
    <p id="load-text">Dünya yükleniyor…</p>
  </div>

  <div id="canvas-wrap"></div>

  <div class="ui">
    <div class="top-bar">
      <div class="brand">burakveyusuf <span>· dünya</span></div>
      <div class="controls">
        <button class="btn" id="btn-mute" title="Ses">🔊</button>
        <button class="btn" id="btn-reset" title="Sıfırla">↺</button>
      </div>
    </div>

    <div style="padding: 0 1.5rem; display:flex; justify-content:flex-end;">
      <div class="panel" id="time-panel">
        <h3>Zaman</h3>
        <div class="time-row">
          <div class="time-display" id="time-label">12:00</div>
        </div>
        <select id="tz-select">
          <option value="Europe/Istanbul">İstanbul (UTC+3)</option>
          <option value="UTC">UTC</option>
          <option value="America/New_York">New York (UTC-4/-5)</option>
          <option value="America/Los_Angeles">Los Angeles</option>
          <option value="Europe/London">Londra</option>
          <option value="Asia/Tokyo">Tokyo</option>
          <option value="Australia/Sydney">Sydney</option>
        </select>
        <input type="range" id="time-slider" min="0" max="1439" value="720" />
        <label class="live-toggle">
          <input type="checkbox" id="live-clock" checked />
          Canlı saat
        </label>
      </div>
    </div>

    <div class="bottom">
      <p class="hint" id="hint">Dünyayı sürükleyerek döndür. Gece tarafında şehir ışıkları yanar.</p>
    </div>
  </div>

  <div class="finale" id="finale">
    <div class="finale-text" id="finale-words"></div>
    <button class="btn primary" style="margin-top:2rem; pointer-events:auto;" id="btn-replay">Tekrar</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const TEX_BASE = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/textures/planets/';
    const loadingEl = document.getElementById('loading');
    const loadProg = document.getElementById('load-prog');
    const loadText = document.getElementById('load-text');

    let loaded = 0;
    const total = 3;
    function onProgress() {
      loaded++;
      loadProg.style.width = ((loaded / total) * 100) + '%';
      if (loaded >= total) {
        setTimeout(() => loadingEl.classList.add('done'), 400);
      }
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05060a);
    scene.fog = new THREE.FogExp2(0x05060a, 0.0008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.35, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.getElementById('canvas-wrap').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.8;
    controls.maxDistance = 8;
    controls.enablePan = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.25;

    // Stars
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 4000;
    const positions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 80 + Math.random() * 120;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({
      color: 0xe8ecf4, size: 0.35, sizeAttenuation: true, transparent: true, opacity: 0.85
    }));
    scene.add(stars);

    // Sun direction (will update)
    const sunDir = new THREE.Vector3(1, 0.15, 0.3).normalize();

    // Load textures
    const loader = new THREE.TextureLoader();
    function loadTex(name, colorSpace = true) {
      return new Promise((resolve) => {
        loader.load(TEX_BASE + name, (tex) => {
          tex.colorSpace = colorSpace ? THREE.SRGBColorSpace : THREE.NoColorSpace;
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.ClampToEdgeWrapping;
          onProgress();
          resolve(tex);
        }, undefined, () => { onProgress(); resolve(null); });
      });
    }

    const [dayMap, nightMap, cloudsMap] = await Promise.all([
      loadTex('earth_atmos_2048.jpg'),
      loadTex('earth_lights_2048.png'),
      loadTex('earth_clouds_1024.png'),
    ]);

    // Earth shader (day/night blend)
    const earthUniforms = {
      dayMap: { value: dayMap },
      nightMap: { value: nightMap },
      sunDirection: { value: sunDir },
      time: { value: 0 },
    };

    const earthMat = new THREE.ShaderMaterial({
      uniforms: earthUniforms,
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vec4 world = modelMatrix * vec4(position, 1.0);
          vWorldPos = world.xyz;
          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `,
      fragmentShader: `
        uniform sampler2D dayMap;
        uniform sampler2D nightMap;
        uniform vec3 sunDirection;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;

        void main() {
          vec3 day = texture2D(dayMap, vUv).rgb;
          vec3 night = texture2D(nightMap, vUv).rgb;
          float nDotL = dot(normalize(vNormal), normalize(sunDirection));
          // Soft terminator
          float term = smoothstep(-0.08, 0.18, nDotL);
          vec3 color = mix(night * 1.25, day, term);
          // Slight atmosphere rim
          float rim = 1.0 - max(dot(normalize(vNormal), normalize(-vWorldPos)), 0.0);
          rim = pow(rim, 3.0) * 0.22 * max(nDotL, 0.0);
          color += vec3(0.35, 0.55, 0.95) * rim;
          gl_FragColor = vec4(color, 1.0);
        }
      `,
    });

    const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), earthMat);
    scene.add(earth);

    // Clouds
    const cloudMat = new THREE.MeshStandardMaterial({
      map: cloudsMap,
      transparent: true,
      opacity: 0.45,
      depthWrite: false,
      side: THREE.DoubleSide,
    });
    const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.012, 96, 96), cloudMat);
    scene.add(clouds);

    // Atmosphere glow
    const atmoMat = new THREE.ShaderMaterial({
      uniforms: {
        sunDirection: { value: sunDir },
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vec4 world = modelMatrix * vec4(position, 1.0);
          vWorldPos = world.xyz;
          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `,
      fragmentShader: `
        uniform vec3 sunDirection;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        void main() {
          float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.2);
          float nDotL = max(dot(normalize(vNormal), normalize(sunDirection)), 0.0);
          vec3 color = mix(vec3(0.15, 0.25, 0.6), vec3(0.4, 0.65, 1.0), nDotL);
          gl_FragColor = vec4(color, intensity * 0.55);
        }
      `,
      side: THREE.BackSide,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(1.08, 64, 64), atmoMat);
    scene.add(atmosphere);

    // Soft ambient + directional
    scene.add(new THREE.AmbientLight(0x223344, 0.35));
    const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.6);
    sunLight.position.copy(sunDir).multiplyScalar(10);
    scene.add(sunLight);

    // Time helpers
    const tzSelect = document.getElementById('tz-select');
    const timeSlider = document.getElementById('time-slider');
    const timeLabel = document.getElementById('time-label');
    const liveClock = document.getElementById('live-clock');
    let clockMinutes = 12 * 60;
    let isLive = true;

    function minutesToLabel(m) {
      const h = Math.floor(m / 60) % 24;
      const min = Math.floor(m % 60);
      return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
    }

    function updateSunFromTime() {
      // Approximate sun position from local minutes (simple model)
      // 0 = midnight, 720 = noon
      const angle = ((clockMinutes - 720) / 1440) * Math.PI * 2;
      // Longitude offset based on timezone roughly
      const tzOffsets = {
        'Europe/Istanbul': 3, 'UTC': 0, 'America/New_York': -4,
        'America/Los_Angeles': -7, 'Europe/London': 1, 'Asia/Tokyo': 9, 'Australia/Sydney': 10
      };
      const lonOffset = (tzOffsets[tzSelect.value] || 0) / 24 * Math.PI * 2;
      sunDir.set(
        Math.cos(angle + lonOffset),
        Math.sin(0.35), // slight seasonal tilt
        Math.sin(angle + lonOffset)
      ).normalize();
      earthUniforms.sunDirection.value.copy(sunDir);
      atmoMat.uniforms.sunDirection.value.copy(sunDir);
      sunLight.position.copy(sunDir).multiplyScalar(10);
      timeLabel.textContent = minutesToLabel(clockMinutes);
    }

    function syncLiveTime() {
      if (!isLive) return;
      const now = new Date();
      // Simple local minutes for selected tz (approximation using offset)
      const offsets = {
        'Europe/Istanbul': 3, 'UTC': 0, 'America/New_York': -4,
        'America/Los_Angeles': -7, 'Europe/London': 1, 'Asia/Tokyo': 9, 'Australia/Sydney': 10
      };
      const utcH = now.getUTCHours() + now.getUTCMinutes() / 60;
      const localH = (utcH + (offsets[tzSelect.value] || 0) + 24) % 24;
      clockMinutes = Math.floor(localH * 60);
      timeSlider.value = clockMinutes;
      updateSunFromTime();
    }

    timeSlider.addEventListener('input', () => {
      isLive = false;
      liveClock.checked = false;
      clockMinutes = +timeSlider.value;
      updateSunFromTime();
    });
    tzSelect.addEventListener('change', () => {
      if (isLive) syncLiveTime();
      else updateSunFromTime();
    });
    liveClock.addEventListener('change', () => {
      isLive = liveClock.checked;
      if (isLive) syncLiveTime();
    });

    // Initial
    syncLiveTime();
    setInterval(syncLiveTime, 30000);

    // Mute / reset
    let muted = false;
    document.getElementById('btn-mute').addEventListener('click', () => {
      muted = !muted;
      document.getElementById('btn-mute').textContent = muted ? '🔇' : '🔊';
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      controls.reset();
      camera.position.set(0, 0.35, 3.2);
      controls.autoRotate = true;
    });

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      earthUniforms.time.value = t;
      clouds.rotation.y = t * 0.008;
      stars.rotation.y = t * 0.0015;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Hint fade
    setTimeout(() => {
      document.getElementById('hint').classList.add('hidden');
    }, 7000);
  </script>
</body>
</html>
