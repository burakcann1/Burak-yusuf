<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>burakveyusuf — Dünya</title>
  <meta name="description" content="burakveyusuf — yörüngeden gerçekçi Dünya. Yusuf için özel hediye." />
  <meta name="theme-color" content="#05060a" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05060a;
      --fg: #e8ecf4;
      --muted: #8b93a7;
      --accent: #7eb8ff;
      --panel: rgba(12, 14, 22, 0.78);
      --border: rgba(255, 255, 255, 0.09);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font-family: "Outfit", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none; -webkit-user-select: none;
    }
    #canvas-wrap { position: fixed; inset: 0; z-index: 0; }
    canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
    .ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; }
    .top-bar {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 1.1rem 1.25rem; gap: 0.5rem;
    }
    .brand {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
    }
    .brand span { opacity: 0.55; font-weight: 500; }
    .controls { display: flex; gap: 0.4rem; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.5rem 0.85rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(14px);
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(22, 26, 40, 0.9); border-color: rgba(255,255,255,0.16); }
    .btn:active { transform: scale(0.96); }
    .btn.primary {
      background: linear-gradient(135deg, #3a6ea5, #1e4a7a);
      border-color: rgba(126, 184, 255, 0.35);
    }
    .btn.active {
      background: rgba(126, 184, 255, 0.18);
      border-color: rgba(126, 184, 255, 0.45);
      color: #b8d8ff;
    }
    .panels-wrap {
      padding: 0 1.25rem;
      display: flex; flex-direction: column; align-items: flex-end; gap: 0.6rem;
      pointer-events: none;
    }
    .panel {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.9rem 1.05rem;
      backdrop-filter: blur(18px);
      max-width: 270px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.38);
      transition: opacity 0.25s, transform 0.25s, max-height 0.3s;
      overflow: hidden;
    }
    .panel.hidden {
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
      max-height: 0;
      padding-top: 0; padding-bottom: 0;
      margin: 0;
      border: none;
      pointer-events: none;
    }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.55rem;
    }
    .panel h3 {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); font-weight: 500; margin: 0;
    }
    .panel-close {
      background: transparent; border: none; color: var(--muted);
      font-size: 1rem; cursor: pointer; padding: 0 0.2rem; line-height: 1;
      opacity: 0.7;
    }
    .panel-close:hover { opacity: 1; color: var(--fg); }
    .time-display {
      font-variant-numeric: tabular-nums;
      font-size: 1.4rem; font-weight: 600;
      margin-bottom: 0.45rem;
    }
    select, input[type="range"] {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 8px;
      padding: 0.42rem 0.55rem;
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      margin-bottom: 0.55rem;
    }
    select { cursor: pointer; }
    input[type="range"] {
      -webkit-appearance: none; height: 5px; padding: 0;
      background: rgba(255,255,255,0.12); border: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px; height: 15px; border-radius: 50%;
      background: var(--accent); cursor: pointer;
      box-shadow: 0 0 8px rgba(126,184,255,0.5);
    }
    .live-toggle {
      display: flex; align-items: center; gap: 0.45rem;
      font-size: 0.78rem; color: var(--muted);
      cursor: pointer;
    }
    .live-toggle input { accent-color: var(--accent); width: auto; }
    .season-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
    }
    .season-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.45rem 0.3rem;
      border-radius: 10px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      text-align: center;
    }
    .season-btn:hover { background: rgba(255,255,255,0.09); }
    .season-btn.active {
      background: rgba(126, 184, 255, 0.15);
      border-color: rgba(126, 184, 255, 0.4);
      color: #c5e0ff;
    }
    .bottom {
      margin-top: auto;
      padding: 1.1rem 1.25rem 1.6rem;
      display: flex; justify-content: center;
    }
    .hint {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      max-width: 340px;
      line-height: 1.45;
      transition: opacity 0.6s;
    }
    .hint.hidden { opacity: 0; pointer-events: none; }
    .hits {
      position: fixed; top: 48%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.6rem; font-weight: 700;
      color: #ff6b6b;
      text-shadow: 0 0 30px rgba(255,80,80,0.85);
      opacity: 0; pointer-events: none; z-index: 15;
      transition: opacity 0.15s;
    }
    .hits.show { opacity: 1; }
    .finale {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(5,6,10,0.68);
      backdrop-filter: blur(7px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.9s;
    }
    .finale.show { opacity: 1; pointer-events: auto; }
    .finale-text {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.7rem, 6.5vw, 3.1rem);
      font-weight: 600;
      text-align: center;
      line-height: 1.35;
      text-shadow: 0 4px 40px rgba(0,0,0,0.9);
      letter-spacing: 0.01em;
      padding: 0 1rem;
    }
    .finale-text span {
      display: block;
      opacity: 0;
      transform: translateY(16px);
      animation: wordIn 0.75s forwards;
    }
    @keyframes wordIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .loading {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg);
      transition: opacity 0.6s, visibility 0.6s;
    }
    .loading.done { opacity: 0; visibility: hidden; }
    .loading-bar {
      width: 160px; height: 3px; background: rgba(255,255,255,0.1);
      border-radius: 2px; overflow: hidden; margin-top: 1rem;
    }
    .loading-bar > div {
      height: 100%; width: 0%; background: var(--accent);
      transition: width 0.25s;
    }
    .loading p { font-size: 0.85rem; color: var(--muted); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="brand" style="font-size:1.5rem">burakveyusuf</div>
    <div class="loading-bar"><div id="load-prog"></div></div>
    <p>Dünya yükleniyor…</p>
  </div>

  <div id="canvas-wrap"></div>
  <div class="hits" id="hits-display"></div>

  <div class="ui">
    <div class="top-bar">
      <div class="brand">burakveyusuf <span>· dünya</span></div>
      <div class="controls">
        <button class="btn" id="btn-time" title="Saat paneli">🕐 Saat</button>
        <button class="btn" id="btn-season" title="Mevsim">🍂 Mevsim</button>
        <button class="btn" id="btn-reset" title="Sıfırla">↺</button>
      </div>
    </div>

    <div class="panels-wrap">
      <!-- TIME PANEL -->
      <div class="panel" id="time-panel">
        <div class="panel-header">
          <h3>Zaman</h3>
          <button class="panel-close" id="close-time" title="Kapat">✕</button>
        </div>
        <div class="time-display" id="time-label">12:00</div>
        <select id="tz-select">
          <option value="Europe/Istanbul">İstanbul (UTC+3)</option>
          <option value="UTC">UTC</option>
          <option value="America/New_York">New York</option>
          <option value="America/Los_Angeles">Los Angeles</option>
          <option value="Europe/London">Londra</option>
          <option value="Asia/Tokyo">Tokyo</option>
          <option value="Australia/Sydney">Sydney</option>
        </select>
        <input type="range" id="time-slider" min="0" max="1439" value="720" />
        <label class="live-toggle">
          <input type="checkbox" id="live-clock" checked />
          Canlı saat
        </label>
      </div>

      <!-- SEASON PANEL -->
      <div class="panel hidden" id="season-panel">
        <div class="panel-header">
          <h3>Mevsim</h3>
          <button class="panel-close" id="close-season" title="Kapat">✕</button>
        </div>
        <div class="season-grid">
          <button class="season-btn" data-season="spring">🌸 İlkbahar</button>
          <button class="season-btn active" data-season="summer">☀️ Yaz</button>
          <button class="season-btn" data-season="autumn">🍂 Sonbahar</button>
          <button class="season-btn" data-season="winter">❄️ Kış</button>
        </div>
        <p style="font-size:0.72rem;color:var(--muted);margin-top:0.55rem;line-height:1.35;">
          Mevsim Güneş eğimini ve atmosfer tonunu değiştirir.
        </p>
      </div>
    </div>

    <div class="bottom">
      <p class="hint" id="hint">Dünyayı sürükleyerek döndür.<br>Dünyaya 3 kere basılı tut → patlat 💥</p>
    </div>
  </div>

  <div class="finale" id="finale">
    <div class="finale-text" id="finale-words"></div>
    <button class="btn primary" style="margin-top:2rem; pointer-events:auto;" id="btn-replay">Tekrar</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const TEX_BASE = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/textures/planets/';
    const loadingEl = document.getElementById('loading');
    const loadProg = document.getElementById('load-prog');
    const hitsDisplay = document.getElementById('hits-display');
    const finaleEl = document.getElementById('finale');
    const finaleWords = document.getElementById('finale-words');
    const timePanel = document.getElementById('time-panel');
    const seasonPanel = document.getElementById('season-panel');
    const btnTime = document.getElementById('btn-time');
    const btnSeason = document.getElementById('btn-season');

    let loaded = 0;
    const total = 3;
    function onProgress() {
      loaded++;
      loadProg.style.width = ((loaded / total) * 100) + '%';
      if (loaded >= total) setTimeout(() => loadingEl.classList.add('done'), 400);
    }

    // Panel toggles
    function showPanel(panel, btn) {
      timePanel.classList.add('hidden');
      seasonPanel.classList.add('hidden');
      btnTime.classList.remove('active');
      btnSeason.classList.remove('active');
      if (panel && btn) {
        panel.classList.remove('hidden');
        btn.classList.add('active');
      }
    }
    btnTime.addEventListener('click', () => {
      if (timePanel.classList.contains('hidden')) showPanel(timePanel, btnTime);
      else showPanel(null, null);
    });
    btnSeason.addEventListener('click', () => {
      if (seasonPanel.classList.contains('hidden')) showPanel(seasonPanel, btnSeason);
      else showPanel(null, null);
    });
    document.getElementById('close-time').addEventListener('click', () => showPanel(null, null));
    document.getElementById('close-season').addEventListener('click', () => showPanel(null, null));

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05060a);
    scene.fog = new THREE.FogExp2(0x05060a, 0.0008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.35, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.getElementById('canvas-wrap').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.8;
    controls.maxDistance = 8;
    controls.enablePan = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.25;

    // Stars
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 4500;
    const positions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 80 + Math.random() * 140;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i*3+2] = r * Math.cos(phi);
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({
      color: 0xe8ecf4, size: 0.32, sizeAttenuation: true, transparent: true, opacity: 0.88
    }));
    scene.add(stars);

    const sunDir = new THREE.Vector3(1, 0.15, 0.3).normalize();
    let seasonTilt = 0.35; // default summer-ish

    const loader = new THREE.TextureLoader();
    function loadTex(name, colorSpace = true) {
      return new Promise((resolve) => {
        loader.load(TEX_BASE + name, (tex) => {
          tex.colorSpace = colorSpace ? THREE.SRGBColorSpace : THREE.NoColorSpace;
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
          onProgress();
          resolve(tex);
        }, undefined, () => { onProgress(); resolve(null); });
      });
    }

    const [dayMap, nightMap, cloudsMap] = await Promise.all([
      loadTex('earth_atmos_2048.jpg'),
      loadTex('earth_lights_2048.png'),
      loadTex('earth_clouds_1024.png'),
    ]);

    const earthUniforms = {
      dayMap: { value: dayMap },
      nightMap: { value: nightMap },
      sunDirection: { value: sunDir },
      time: { value: 0 },
      explode: { value: 0 },
      seasonTint: { value: new THREE.Color(1, 1, 1) },
    };

    const earthMat = new THREE.ShaderMaterial({
      uniforms: earthUniforms,
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        uniform float explode;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vec3 pos = position + normal * explode * 0.38;
          vec4 world = modelMatrix * vec4(pos, 1.0);
          vWorldPos = world.xyz;
          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `,
      fragmentShader: `
        uniform sampler2D dayMap;
        uniform sampler2D nightMap;
        uniform vec3 sunDirection;
        uniform float explode;
        uniform vec3 seasonTint;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        void main() {
          vec3 day = texture2D(dayMap, vUv).rgb * seasonTint;
          vec3 night = texture2D(nightMap, vUv).rgb;
          float nDotL = dot(normalize(vNormal), normalize(sunDirection));
          float term = smoothstep(-0.08, 0.18, nDotL);
          vec3 color = mix(night * 1.28, day, term);
          float rim = 1.0 - max(dot(normalize(vNormal), normalize(-vWorldPos)), 0.0);
          rim = pow(rim, 3.0) * 0.24 * max(nDotL, 0.0);
          color += vec3(0.35, 0.55, 0.95) * rim;
          color += vec3(1.0, 0.55, 0.18) * explode * 1.9;
          gl_FragColor = vec4(color, 1.0 - explode * 0.42);
        }
      `,
      transparent: true,
    });

    const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), earthMat);
    scene.add(earth);

    const clouds = new THREE.Mesh(
      new THREE.SphereGeometry(1.012, 96, 96),
      new THREE.MeshStandardMaterial({
        map: cloudsMap, transparent: true, opacity: 0.42,
        depthWrite: false, side: THREE.DoubleSide
      })
    );
    scene.add(clouds);

    const atmoMat = new THREE.ShaderMaterial({
      uniforms: {
        sunDirection: { value: sunDir },
        explode: { value: 0 },
        seasonTint: { value: new THREE.Color(0.4, 0.65, 1.0) }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vec4 world = modelMatrix * vec4(position, 1.0);
          vWorldPos = world.xyz;
          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `,
      fragmentShader: `
        uniform vec3 sunDirection;
        uniform float explode;
        uniform vec3 seasonTint;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        void main() {
          float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.15);
          float nDotL = max(dot(normalize(vNormal), normalize(sunDirection)), 0.0);
          vec3 color = mix(vec3(0.12, 0.22, 0.55), seasonTint, nDotL);
          color += vec3(1.0, 0.48, 0.12) * explode;
          gl_FragColor = vec4(color, intensity * 0.58 * (1.0 - explode * 0.55));
        }
      `,
      side: THREE.BackSide,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(1.085, 64, 64), atmoMat);
    scene.add(atmosphere);

    scene.add(new THREE.AmbientLight(0x223344, 0.32));
    const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.65);
    sunLight.position.copy(sunDir).multiplyScalar(10);
    scene.add(sunLight);

    // --- Seasons ---
    const seasonData = {
      spring: { tilt: 0.22, tint: [1.05, 1.02, 0.98], atmo: [0.45, 0.7, 0.95], name: 'İlkbahar' },
      summer: { tilt: 0.38, tint: [1.0, 1.0, 1.0], atmo: [0.4, 0.65, 1.0], name: 'Yaz' },
      autumn: { tilt: 0.18, tint: [1.08, 0.95, 0.85], atmo: [0.55, 0.55, 0.75], name: 'Sonbahar' },
      winter: { tilt: -0.15, tint: [0.92, 0.95, 1.08], atmo: [0.5, 0.65, 0.95], name: 'Kış' },
    };
    let currentSeason = 'summer';

    document.querySelectorAll('.season-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSeason = btn.dataset.season;
        const s = seasonData[currentSeason];
        seasonTilt = s.tilt;
        earthUniforms.seasonTint.value.set(s.tint[0], s.tint[1], s.tint[2]);
        atmoMat.uniforms.seasonTint.value.set(s.atmo[0], s.atmo[1], s.atmo[2]);
        updateSunFromTime();
      });
    });

    // --- Hits / Explosion ---
    let hits = 0;
    const MAX_HITS = 3;
    let isHolding = false;
    let holdTimer = null;
    let exploded = false;
    let explodeProgress = 0;
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function showHitFeedback() {
      hitsDisplay.textContent = hits + ' / ' + MAX_HITS;
      hitsDisplay.classList.add('show');
      setTimeout(() => hitsDisplay.classList.remove('show'), 700);
    }

    function triggerExplosion() {
      exploded = true;
      controls.autoRotate = false;
      controls.enabled = false;
      // Finale with Yusuf
      const words = ['Sen', 'Dünyanın', 'En', 'İyi', 'Dostusun', 'Yusuf'];
      finaleWords.innerHTML = words.map((w, i) =>
        `<span style="animation-delay:${0.12 + i * 0.2}s">${w}</span>`
      ).join('');
      setTimeout(() => finaleEl.classList.add('show'), 550);
    }

    function onPointerDown(e) {
      if (exploded) return;
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = -(e.clientY / window.innerHeight) * 2 + 1;
      pointer.set(x, y);
      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObject(earth);
      if (intersects.length === 0) return;

      isHolding = true;
      holdTimer = setTimeout(() => {
        if (!isHolding || exploded) return;
        hits++;
        showHitFeedback();
        earth.scale.setScalar(1.045);
        setTimeout(() => { if (!exploded) earth.scale.setScalar(1); }, 110);
        if (hits >= MAX_HITS) triggerExplosion();
      }, 260);
    }

    function onPointerUp() {
      isHolding = false;
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    }

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    // Time
    const tzSelect = document.getElementById('tz-select');
    const timeSlider = document.getElementById('time-slider');
    const timeLabel = document.getElementById('time-label');
    const liveClock = document.getElementById('live-clock');
    let clockMinutes = 12 * 60;
    let isLive = true;

    function minutesToLabel(m) {
      return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0');
    }

    function updateSunFromTime() {
      const angle = ((clockMinutes - 720) / 1440) * Math.PI * 2;
      const tzOffsets = {
        'Europe/Istanbul': 3, 'UTC': 0, 'America/New_York': -4,
        'America/Los_Angeles': -7, 'Europe/London': 1, 'Asia/Tokyo': 9, 'Australia/Sydney': 10
      };
      const lonOffset = (tzOffsets[tzSelect.value] || 0) / 24 * Math.PI * 2;
      sunDir.set(
        Math.cos(angle + lonOffset),
        Math.sin(seasonTilt),
        Math.sin(angle + lonOffset)
      ).normalize();
      earthUniforms.sunDirection.value.copy(sunDir);
      atmoMat.uniforms.sunDirection.value.copy(sunDir);
      sunLight.position.copy(sunDir).multiplyScalar(10);
      timeLabel.textContent = minutesToLabel(clockMinutes);
    }

    function syncLiveTime() {
      if (!isLive) return;
      const now = new Date();
      const offsets = {
        'Europe/Istanbul': 3, 'UTC': 0, 'America/New_York': -4,
        'America/Los_Angeles': -7, 'Europe/London': 1, 'Asia/Tokyo': 9, 'Australia/Sydney': 10
      };
      const utcH = now.getUTCHours() + now.getUTCMinutes() / 60;
      const localH = (utcH + (offsets[tzSelect.value] || 0) + 24) % 24;
      clockMinutes = Math.floor(localH * 60);
      timeSlider.value = clockMinutes;
      updateSunFromTime();
    }

    timeSlider.addEventListener('input', () => {
      isLive = false; liveClock.checked = false;
      clockMinutes = +timeSlider.value; updateSunFromTime();
    });
    tzSelect.addEventListener('change', () => { if (isLive) syncLiveTime(); else updateSunFromTime(); });
    liveClock.addEventListener('change', () => { isLive = liveClock.checked; if (isLive) syncLiveTime(); });
    syncLiveTime();
    setInterval(syncLiveTime, 30000);

    // Reset
    function fullReset() {
      hits = 0; exploded = false; explodeProgress = 0;
      earthUniforms.explode.value = 0;
      atmoMat.uniforms.explode.value = 0;
      earth.scale.setScalar(1);
      clouds.scale.setScalar(1);
      atmosphere.scale.setScalar(1);
      clouds.visible = true;
      atmosphere.visible = true;
      controls.enabled = true;
      controls.autoRotate = true;
      finaleEl.classList.remove('show');
      finaleWords.innerHTML = '';
    }

    document.getElementById('btn-reset').addEventListener('click', () => {
      fullReset();
      controls.reset();
      camera.position.set(0, 0.35, 3.2);
    });
    document.getElementById('btn-replay').addEventListener('click', fullReset);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animate
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      earthUniforms.time.value = t;

      if (exploded) {
        explodeProgress = Math.min(1, explodeProgress + 0.011);
        earthUniforms.explode.value = explodeProgress;
        atmoMat.uniforms.explode.value = explodeProgress;
        const s = 1 + explodeProgress * 1.85;
        earth.scale.setScalar(s);
        clouds.scale.setScalar(s * 1.06);
        atmosphere.scale.setScalar(s * 1.12);
        if (explodeProgress > 0.55) {
          clouds.visible = false;
          atmosphere.visible = false;
        }
      } else {
        clouds.rotation.y = t * 0.0075;
      }

      stars.rotation.y = t * 0.0012;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    setTimeout(() => document.getElementById('hint').classList.add('hidden'), 10000);
  </script>
</body>
</html>
